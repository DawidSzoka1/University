{# Pole formularza: etykieta powiązana for/id, pomoc i błąd tekstem (aria-describedby ustawia formularz) #}
<div class="form-group{% if field.errors %} form-group--error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}{% if field.field.required and show_required %} <span class="form-required" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text and help %}
    <p class="form-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
    <p class="form-field-error" id="{{ field.auto_id }}-error">{{ field.errors.0 }}</p>
    {% endif %}
</div>
