services:
  # ───────────────────────────────
  # PostgreSQL Database
  # ───────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
      POSTGRES_USER: ${POSTGRES_USER:-elearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elearning_secret}
    ports:
      # Domyślnie 5433 na hoście, aby nie kolidować z lokalnym PostgreSQL (5432).
      # Kontener i tak łączy się z bazą po wewnętrznej nazwie `db:5432`.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elearning}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────
  # Django Web Application
  # ───────────────────────────────
  web:
    build: .
    command: >
      bash -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      # Ollama uruchomiona na hoście (np. z GPU): OLLAMA_BASE_URL=http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────
  # Redis (sessions, cache, celery)
  # ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Domyślnie 6380 na hoście, aby nie kolidować z lokalnym Redisem (6379).
      # Aplikacja łączy się wewnętrznie przez `redis:6379`.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────
  # Ollama (Polish LLM – Bielik)
  # ───────────────────────────────
  # Uruchamiana tylko z profilem "ai" (model zajmuje kilka GB):
  #   docker compose --profile ai up -d ollama
  #   docker compose exec ollama ollama pull hf.co/speakleash/Bielik-Minitron-7B-v3.0-Instruct-GGUF:Q4_K_M
  # Bez niej platforma działa, a asystent pokazuje komunikat o niedostępności.
  # Pełna instrukcja (też Ollama na hoście z GPU): docs/asystent-bielik.md
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"

  # ───────────────────────────────
  # Stripe CLI — przekazuje webhooki płatności testowych do aplikacji
  # ───────────────────────────────
  # Uruchamiana tylko z profilem "stripe" (wymaga STRIPE_SECRET_KEY w .env):
  #   docker compose --profile stripe up -d
  # Sekret webhooka (whsec_…) zapisuje sama do .stripe/webhook_secret — Django czyta go z pliku,
  # więc nie trzeba go kopiować do .env. Instrukcja: docs/platnosci-stripe.md
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$STRIPE_SECRET_KEY" ]; then echo "Brak STRIPE_SECRET_KEY w .env — webhook Stripe nie wystartuje."; exit 1; fi
        stripe listen --api-key "$$STRIPE_SECRET_KEY" --skip-update --print-secret > /secrets/webhook_secret
        echo "Sekret webhooka zapisany w .stripe/webhook_secret"
        exec stripe listen --api-key "$$STRIPE_SECRET_KEY" --skip-update \
          --events checkout.session.completed,checkout.session.async_payment_succeeded \
          --forward-to http://web:8000/orders/webhook/stripe/
    volumes:
      - ./.stripe:/secrets
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data:
  ollama_data:
